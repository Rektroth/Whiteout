plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}

}

loom {
	splitEnvironmentSourceSets()

	mods {
		"modid" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// If I'm developing in a Minecraft snapshot, this sets the version to the prior release.
	// This is solely for streamlining development, so I can still grab an old Lithium build to use temporarily.
	def dev_minecraft_version = project.minecraft_version
	if (dev_minecraft_version.contains("snapshot")) {
		dev_minecraft_version = dev_minecraft_version.tokenize("-")[0]
		def split_minecraft_version = dev_minecraft_version.tokenize(".")
		split_minecraft_version[1] = (split_minecraft_version[1] as int) - 1
		dev_minecraft_version = split_minecraft_version.join('.');
	}
	// Follows the established version shema of Lithium.
	def dev_lithium_version = "mc" + dev_minecraft_version + '-' + lithium_version + "-fabric"
	// Lithium
	compileOnly "maven.modrinth:lithium:${dev_lithium_version}"
}

processResources {
	def version = project.version

	// This is a convoluted way of replacing "-snapshot-#" with "-alpha.#" in the fabric.mod.json,
	// which is necessary because of how Loom handles Minecraft versions versus the Minecraft client and Fabric loader.
	// This is purely for streamlining development.
	def mc_version = minecraft_version.replace("snapshot", "alpha").replace('-', '#').replaceFirst('#', '-').replace('#', '.')

	def fabric_version = loader_version

	def current_lithium_version = lithium_version

	def split_lithium_version = current_lithium_version.tokenize('.')
	split_lithium_version[1] = (split_lithium_version[1] as int) + 1
	split_lithium_version[2] = "0"
	def next_lithium_version = split_lithium_version.join('.')

	inputs.property "version", version
	inputs.property "mc_version", mc_version
	inputs.property "fabric_version", fabric_version
	inputs.property "lithium_version", current_lithium_version
	inputs.property "next_lithium_version", next_lithium_version

	filesMatching("fabric.mod.json") {
		expand ([
			"version": version,
			"mc_version": mc_version,
			"fabric_version": fabric_version,
			"lithium_version": current_lithium_version,
			"next_lithium_version": next_lithium_version
		])
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
